name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @qd/api db:generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Скрипт стартует с `set -e` — любая ошибка валит деплой.
          # Пути и имена служб должны совпасть с тем, что реально на сервере;
          # если они другие — поправь APP_DIR / SERVICES.
          script: |
            set -euo pipefail

            APP_DIR="/opt/community-"
            SERVICES="qd-api qd-web"

            # Non-interactive SSH не подгружает .bashrc — вручную добавим
            # типовые пути и source nvm, если он у юзера используется.
            export PATH="$HOME/.local/share/pnpm:$HOME/.npm-global/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -1)/bin:/usr/local/bin:/usr/bin:$PATH"
            [ -f "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

            echo "→ checking node"
            command -v node >/dev/null || { echo "❌ Node.js не установлен на сервере. Поставь Node 20: curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt install -y nodejs"; exit 1; }
            node --version

            echo "→ ensuring pnpm via corepack"
            if ! command -v pnpm >/dev/null; then
              corepack enable
              corepack prepare pnpm@9.0.0 --activate
              export PATH="$HOME/.local/share/pnpm:$PATH"
            fi
            pnpm --version

            echo "→ pulling main"
            cd "$APP_DIR"
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "→ installing dependencies"
            pnpm install --frozen-lockfile

            echo "→ prisma generate + migrate deploy"
            pnpm --filter @qd/api db:generate
            pnpm --filter @qd/api exec prisma migrate deploy

            echo "→ building api + web"
            pnpm build

            echo "→ restarting services: $SERVICES"
            sudo systemctl restart $SERVICES

            echo "✓ deploy completed at $(date -u +%FT%TZ)"
