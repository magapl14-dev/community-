services:
  postgres:
    image: postgres:15-alpine
    container_name: qd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qd_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quantum_dagestan}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qd} -d ${POSTGRES_DB:-quantum_dagestan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qd_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - qd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qd_pg_data:
  qd_redis_data:
